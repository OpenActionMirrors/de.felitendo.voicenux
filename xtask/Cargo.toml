[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "Tools to build, package and test the Voicenux plugin: cargo xtask <command>"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", default-features = false }
voicenux-plugin = { path = ".." }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
